name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project
        run: python3 generate.py && python3 patch3.py && python3 patch3b.py && python3 patch4.py && python3 patch5.py && python3 patch6.py && python3 patch7.py && python3 patch8.py && python3 patch9.py && python3 patch9b.py && python3 patch10.py && python3 patch11.py && python3 patch12.py && pytho
