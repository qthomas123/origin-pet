name: Build Origin Pet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project
        run: python build_app_project.py

      - name: Enable AndroidX in gradle.properties
        run: |
          if [ -f app-project/gradle.properties ]; then
            sed -i 's/android.useAndroidX=false/android.useAndroidX=true/g' app-project/gradle.properties
          fi

      - name: Build Debug APK
        working-directory: app-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: origin-pet-apk
          path: app-project/app/build/outputs/apk/debug/*.apk
